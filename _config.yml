# Jekyll configuration for the Greater Baltimore Learning Center site.
# GitHub Pages builds this automatically; no workflow file is needed.

title: Greater Baltimore Learning Center
description: A new faith-based early learning center for ages 2 to 5 in Gwynn Oak, being built by Greater Baltimore Church.

# [TBD: set to the final domain, for example https://example.org, once chosen]
# For a project site before the custom domain is live, set url to
# https://YOUR-ORG.github.io and baseurl to /YOUR-REPO
url: ""
baseurl: ""

markdown: kramdown
permalink: pretty

exclude:
  - README.md
  - LAUNCH-CHECKLIST.md
  - ASSETS-SHOOT-LIST.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
