# Jekyll configuration for the Greater Impact Learning Center site.
# GitHub Pages builds this automatically; no workflow file is needed.

title: Greater Impact Learning Center
description: Faith-based learning and family support in Gwynn Oak, founded by Greater Baltimore Church.

# [TBD: set to the final domain, for example https://example.org, once chosen]
# For a project site before the custom domain is live, set url to
# https://YOUR-ORG.github.io and baseurl to /YOUR-REPO
url: ""
baseurl: ""

markdown: kramdown
permalink: pretty

exclude:
  - README.md
  - LAUNCH-CHECKLIST.md
  - ASSETS-SHOOT-LIST.md
  - IMAGE-NOTES.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
