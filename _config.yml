# Jekyll configuration for the Greater Baltimore Learning Center site.
# GitHub Pages builds this automatically; no workflow file is needed.

title: Greater Baltimore Learning Center
description: Faith-based learning and family support in Gwynn Oak, founded by Greater Baltimore Church.

# Custom domain from CNAME. Keep baseurl empty for a root-domain site.
url: "https://gbimpact.org"
baseurl: ""

markdown: kramdown
permalink: pretty

exclude:
  - README.md
  - LAUNCH-CHECKLIST.md
  - ASSETS-SHOOT-LIST.md
  - IMAGE-NOTES.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
