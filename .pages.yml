media: assets/images
content:
  - name: settings
    label: Campaign settings
    type: file
    path: _data/site.yml
    fields:
      - { name: name, label: Learning Center name, type: string }
      - { name: campaign_name, label: Campaign name, type: string }
      - { name: campaign_url, label: Givebutter page (gifts and updates), type: string }
      - { name: campaign_goal_text, label: Campaign goal description, type: string }
      - { name: campaign_goal_amount, label: Campaign goal amount, type: string }
      - { name: campaign_recipient, label: Gift recipient, type: string }
      - { name: email, label: Business contact email, type: string }
      - { name: prototype_email, label: Show prototype contact labels, type: boolean }
      - { name: video_youtube_id, label: Optional YouTube video ID, type: string }
      - { name: video_title, label: Video title, type: string }
      - { name: alt_hero, label: Hero photo description, type: string }
      - { name: alt_family, label: Family image description, type: string }
      - { name: alt_summer, label: Summer image description, type: string }
      - { name: share_title, label: Social preview title, type: string }
      - { name: share_description, label: Social preview description, type: text }
