# Givebutter account ID for the updates signup form. Find it in Givebutter under
# Sharing > Widgets. Leave blank until you have it; the page shows a fallback instead.
givebutter_account_id: ""

# Welcome video. Upload the video to YouTube (Unlisted is fine), then paste the part of
# the address after v= (for example dQw4w9WgXcQ). Leave blank to show the photo instead.
video_youtube_id: ""
video_title: "A short welcome from the Greater Baltimore Learning Center"

