# Editable site settings. Change values here; do not change the keys on the left.
# Anything in [TBD: ...] brackets is an open decision. Search the site for "[TBD" before launch.

# Shows a "prototype" banner and review notes. Set to false at launch.
prototype_banner: true

# Turn on after adding the two font files described in README.md (assets/fonts/).
custom_fonts: false

name: Greater Baltimore Learning Center
church_name: Greater Baltimore Church
campaign_name: Greater Impact
campaign_goal_text: "$1 million over two years"

# Hosted Givebutter campaign page (primary Give button target)
